####################################################################
# ABCD Ltd — docker-compose for Coolify / local Docker deployment
####################################################################
# On Coolify:
#   1. Add a new resource → Docker Compose based
#   2. Point to this repository (github.com/topmuch/ABCD)
#   3. Coolify will use this docker-compose.yml automatically
#
# Required environment variables (set in Coolify dashboard):
#   - ADMIN_EMAIL      (e.g. admin@abcd.com)
#   - ADMIN_PASSWORD   (set a strong password!)
#
# Optional environment variables:
#   - ADMIN_NAME       (default: "Administrateur ABCD")
#   - DATABASE_URL     (default: file:/app/db/custom.db)
#   - NODE_ENV         (default: production)
####################################################################

services:
  abcd-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abcd-ltd
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=file:/app/db/custom.db
      # ---- Admin credentials (override in Coolify env vars) ----
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@abcd.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-abcd2025}
      - ADMIN_NAME=${ADMIN_NAME:-Administrateur ABCD}
    volumes:
      # Persistent storage for the SQLite database
      - abcd-db:/app/db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  abcd-db:
    driver: local
